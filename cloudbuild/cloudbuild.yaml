# Cloud Build alternative to the GitHub Actions deploy: build a Java service with Jib into
# Artifact Registry and roll it out to GKE. Trigger example:
#   gcloud builds triggers create github --repo-name=tb-integration-services --repo-owner=sdhayanand \
#     --branch-pattern='^main$' --build-config=cloudbuild/cloudbuild.yaml \
#     --substitutions=_MODULE=order-intake-api,_NAMESPACE=otd
# (This file lives in tb-platform-infra as the reference; copy it into a service repo to use it.)
substitutions:
  _REGION: us-central1
  _AR_REPO: tb-otd
  _MODULE: order-intake-api
  _NAMESPACE: otd
  _CLUSTER: tb-otd-autopilot

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

steps:
  - id: unit-tests
    name: maven:3.9-eclipse-temurin-21
    entrypoint: mvn
    args: ['-B', '-ntp', '-pl', '${_MODULE}', '-am', 'test']

  - id: jib
    name: maven:3.9-eclipse-temurin-21
    entrypoint: mvn
    args:
      - '-B'
      - '-ntp'
      - '-DskipTests'
      - '-pl'
      - '${_MODULE}'
      - '-am'
      - 'compile'
      - 'jib:build'
      - '-Djib.to.image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_MODULE}:$SHORT_SHA'
      - '-Djib.to.tags=latest'

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        gcloud container clusters get-credentials ${_CLUSTER} --region ${_REGION} --project $PROJECT_ID
        export PROJECT_ID=$PROJECT_ID IMAGE_TAG=$SHORT_SHA
        kubectl kustomize ${_MODULE}/deploy/k8s/overlays/gcp | envsubst '$${PROJECT_ID} $${IMAGE_TAG}' | kubectl apply -n ${_NAMESPACE} -f -
        kubectl -n ${_NAMESPACE} rollout status deployment/${_MODULE} --timeout=300s

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_MODULE}:$SHORT_SHA'
